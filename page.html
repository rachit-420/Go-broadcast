<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebSocket chat</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem auto;
            max-width: 40rem;
            padding: 0 1rem;
        }

        #messages {
            border: 1px solid #ccc;
            height: 18rem;
            list-style: none;
            overflow-y: auto;
            padding: 0.75rem;
        }

        #message-form {
            display: flex;
            gap: 0.5rem;
        }

        #message-input {
            flex: 1;
            min-width: 0;
        }
    </style>
</head>
<body>
    <h1>WebSocket messages</h1>
    <p id="connection-status" role="status">Connecting…</p>
    <ul id="messages" aria-live="polite"></ul>
    <form id="message-form">
        <label for="message-input">Message</label>
        <input id="message-input" name="message" type="text" autocomplete="off" required disabled>
        <button id="send-button" type="submit" disabled>Send</button>
    </form>

<script>
    const socket = new WebSocket("ws://localhost:8080/ws");
    const form = document.getElementById("message-form");
    const input = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");
    const messages = document.getElementById("messages");
    const connectionStatus = document.getElementById("connection-status");

    socket.onopen = () => {
        connectionStatus.textContent = "Connected";
        input.disabled = false;
        sendButton.disabled = false;
        input.focus();
    };

    socket.onmessage = (event) => {
        const item = document.createElement("li");
        item.textContent = `Server: ${event.data}`;
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
    };

    socket.onerror = () => {
        connectionStatus.textContent = "Connection error";
    };

    socket.onclose = () => {
        connectionStatus.textContent = "Disconnected";
        input.disabled = true;
        sendButton.disabled = true;
    };

    form.addEventListener("submit", (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message || socket.readyState !== WebSocket.OPEN) {
            return;
        }

        socket.send(message);
        input.value = "";
        input.focus();
    });
</script>

</body>
</html>
