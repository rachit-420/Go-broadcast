<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebSocket chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>WebSocket messages</h1>
    <p id="connection-status" role="status">Enter your name to connect.</p>
    <ul id="messages" aria-live="polite"></ul>
    <form id="name-form">
        <label for="name-input">Name</label>
        <input id="name-input" name="username" type="text" autocomplete="name" required>
        <button type="submit">Connect</button>
    </form>
    <form id="message-form" hidden>
        <label for="message-input">Message</label>
        <input id="message-input" name="message" type="text" autocomplete="off" required disabled>
        <button id="send-button" type="submit" disabled>Send</button>
    </form>

<script src="app.js" defer></script>
</body>
</html>
